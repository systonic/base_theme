name: Systonic base theme
type: theme
'base theme': gin
core_version_requirement: ^11
hidden: true
version: VERSION

libraries:
  - base_theme/custom

regions:
  page_top: 'Page top'
  header: Header
  content_above: 'Content Above'
  content: Content
  content_below: 'Content Below'
  footer: Footer
  page_bottom: 'Page bottom'
  disabled: Disabled

ckeditor5-stylesheets:
  - dist/css/ckeditor.css

libraries-override:
  gin/gin:
    css:
      theme:
        dist/css/base/gin.css: false
  core/normalize:
    css:
      base:
        assets/vendor/normalize-css/normalize.css: false
  claro/global-styling:
    css:
      base:
        css/base/elements.css: false
      component:
        css/components/fieldset.css: false
        css/components/form.css: false
  claro/views:
    css:
      component:
        css/components/views-exposed-form.css: false
